name: Windows build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      signed-artifact-id: ${{ steps.signed-upload.outputs.artifact-id }}
    env:
      DESKTOPPET_PUBLIC_KEY: ${{ vars.DESKTOPPET_PUBLIC_KEY }}
      DESKTOPPET_BACKUP_PUBLIC_KEY: ${{ vars.DESKTOPPET_BACKUP_PUBLIC_KEY }}
      UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Reject sensitive tracked files
        shell: pwsh
        run: |
          python tools/Check-Sensitive.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/security_tool_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure x64 / static runtime
        shell: pwsh
        run: |
          $owner, $repo = $env:GITHUB_REPOSITORY.Split('/')
          cmake -S . -B build -A x64 "-DDESKTOPPET_OWNER=$owner" "-DDESKTOPPET_REPOSITORY=$repo" "-DDESKTOPPET_PUBLIC_KEY=$env:DESKTOPPET_PUBLIC_KEY" "-DDESKTOPPET_BACKUP_PUBLIC_KEY=$env:DESKTOPPET_BACKUP_PUBLIC_KEY"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify actual PE mitigations and runtime imports
        shell: pwsh
        run: ./tools/Test-PE.ps1
      - name: Display executable SHA256
        shell: pwsh
        run: |
          Get-FileHash build/Release/DesktopPet.exe -Algorithm SHA256 | Format-List Algorithm, Hash, Path
          Get-FileHash build/Release/Updater.exe -Algorithm SHA256 | Format-List Algorithm, Hash, Path
      - name: Portable package (CI)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: ./tools/Package.ps1
      - name: Signed release package
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./tools/Package.ps1 -Sign -Tag $env:GITHUB_REF_NAME
      - name: Reject sensitive package contents
        if: github.event_name == 'push' || !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist/*.zip | ForEach-Object FullName)
          if ($packages.Count -ne 2) { throw 'Exactly two ZIPs required.' }
          python tools/Check-Sensitive.py @packages
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: DesktopPet-portable
          if-no-files-found: error
          path: |
            dist/DesktopPet_v*.zip
            dist/DesktopPet-windows-x64.zip
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: signed-upload
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        with:
          name: signed-release
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/update.json
            dist/update.sig
            dist/RELEASE_NOTES.md
  provenance:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.signed-artifact-id }}
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.zip
            dist/update.json
            dist/update.sig
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: [build, provenance]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.signed-artifact-id }}
          path: dist
          merge-multiple: true
      - name: Verify provenance before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot resolve release tag.' }
          $object = $ref.object
          for ($depth=0; $object.type -eq 'tag' -and $depth -lt 8; $depth++) {
            $tag = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" | ConvertFrom-Json
            if ($LASTEXITCODE) { throw 'Cannot resolve annotated tag.' }
            $object = $tag.object
          }
          if ($object.type -ne 'commit' -or $object.sha -cne $env:GITHUB_SHA) { throw 'Tag moved or source commit mismatch; refusing publication.' }
          foreach ($file in Get-ChildItem dist -File) {
            gh attestation verify $file.FullName --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/build.yml" --source-ref $env:GITHUB_REF --source-digest $env:GITHUB_SHA --deny-self-hosted-runners
            if ($LASTEXITCODE) { throw 'Build provenance verification failed; refusing publication.' }
          }
      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manual = @(Get-ChildItem dist/DesktopPet_v*.zip)
          if ($manual.Count -ne 1) { throw 'Exactly one versioned portable ZIP required.' }
          gh release create $env:GITHUB_REF_NAME "$($manual[0].FullName)" dist/DesktopPet-windows-x64.zip dist/SHA256SUMS.txt dist/update.json dist/update.sig --repo $env:GITHUB_REPOSITORY --title "DesktopPet $env:GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md --verify-tag --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
